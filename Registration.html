<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container card matching the wireframe wire layout */
        .register-card {
            width: 360px;
            padding: 40px 30px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Heading */
        .register-card h1 {
            font-size: 24px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 30px;
            color: #111111;
        }

        /* Form layout */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Input fields styling */
        .input-field {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: #555555;
            background-color: #ffffff;
            border: 1px solid #b0b0b0;
            box-sizing: border-box;
            outline: none;
        }

        .input-field::placeholder {
            color: #777777;
        }

        .input-field:focus {
            border-color: #666666;
        }

        /* Grey Sign Up button matching wireframe */
        .signup-btn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #000000;
            background-color: #dcdcdc;
            border: 1px solid #b0b0b0;
            cursor: pointer;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .signup-btn:hover {
            background-color: #cecece;
        }

        /* Footer link text */
        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #333333;
            text-align: center;
        }

        .footer-text a {
            color: #333333;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            body {
                padding: 16px;
                height: auto;
                min-height: 100vh;
                box-sizing: border-box;
            }

            .register-card {
                width: 100%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h1>Register</h1>
        
        <form onsubmit="handleSubmit(event)">
            <input type="text" class="input-field" name="username" placeholder="Username" required>
            <input type="email" class="input-field" name="email" placeholder="Email" required>
            <input type="password" class="input-field" name="password" placeholder="Password" required>
            <input type="password" class="input-field" name="confirmPassword" placeholder="Confirm Password" required>
            
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="index.html">Log In</a>
        </div>
    </div>

    <script>
        window.handleSubmit = async function (event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const username = formData.get("username").toString().trim();
            const email = formData.get("email").toString().trim();
            const password = formData.get("password").toString();
            const confirmPassword = formData.get("confirmPassword").toString();

            if (!username || !email || !password || !confirmPassword) {
                alert("All fields are required.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            try {
                const response = await fetch("register.php", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    alert(result.message || "Registration failed.");
                    return;
                }

                alert("Registration successful! Please log in.");
                window.location.href = "index.html";
            } catch (error) {
                alert("Unable to connect to the server. Please check XAMPP.");
            }
        };
    </script>
</body>
</html>
